name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Разрешения, которых требует публикация через GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: публикуем последний коммит, текущий не рвём.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Project site живёт по адресу /<repo>/ — отсюда и базовый путь.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Публичные значения: anon-ключ Supabase рассчитан на клиент,
          # доступ ограничивают RLS-политики (supabase/schema.sql).
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_PACK_SLUG: ${{ vars.PACK_SLUG }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
